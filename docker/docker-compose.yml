services:
  postgres:
    image: postgres:16-alpine
    container_name: multi_store_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: multistore
      POSTGRES_PASSWORD: multistore
      POSTGRES_DB: multistore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multistore -d multistore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
